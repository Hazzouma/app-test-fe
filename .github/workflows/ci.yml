name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install Yarn Berry
        run: npm install -g yarn@berry

      - name: Configure Yarn Berry
        run: |
          echo "yarnPath: .yarn/releases/yarn-4.18.1.cjs" >> .yarnrc.yml
          mkdir -p .yarn/releases
          curl -Lo .yarn/releases/yarn-4.18.1.cjs https://repo.yarnpkg.com/4.18.1/packages/yarnpkg-cli/bin/yarn.js
          chmod +x .yarn/releases/yarn-4.18.1.cjs

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run type check
        run: yarn type-check

      - name: Build project
        run: yarn build
